# The same checks as lefthook.yml, for changes that skipped the local hooks: `git commit --no-verify`, GitHub's web
# editor, or a clone where `lefthook install` was never run.
name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A squash merge makes the pull request title the commit message, so the title is checked too. It reaches the
      # script through the environment, never the script text, because anyone opening a pull request writes it.
      - name: Check the pull request title and every commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          printf '%s\n' "$TITLE" | bash scripts/check-commit-msg.sh - || { echo "in the pull request title"; status=1; }
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" | bash scripts/check-commit-msg.sh - || { echo "in commit $sha"; status=1; }
          done
          exit "$status"

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck and shfmt
        run: brew install shellcheck shfmt
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: shfmt
        run: git ls-files -z '*.sh' | xargs -0 shfmt --diff

  plugins:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.289
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Validating the marketplace does not open its plugins, and does not catch an entry whose source path is
      # missing, so each listed plugin is validated on its own.
      - name: Validate the marketplace and each plugin it lists
        run: |
          claude plugin validate . --strict
          status=0
          for source in $(jq -r '.plugins[].source | strings' .claude-plugin/marketplace.json); do
            echo "== $source"
            claude plugin validate "$source" --strict || status=1
          done
          exit "$status"
      - name: Install each plugin from the marketplace
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          claude plugin marketplace add "$PWD"
          marketplace=$(jq -r .name .claude-plugin/marketplace.json)
          for plugin in $(jq -r '.plugins[].name' .claude-plugin/marketplace.json); do
            claude plugin install "$plugin@$marketplace"
          done
          claude plugin list

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # /bin/bash is 3.2 on macOS, the oldest bash the scripts must support, and 5 on Ubuntu.
      - name: Run every test suite under /bin/bash
        run: |
          /bin/bash --version | head -1
          status=0
          for suite in $(git ls-files '*.test.sh'); do
            echo "== $suite"
            BASH_UNDER_TEST=/bin/bash /bin/bash "$suite" || status=1
          done
          exit "$status"
