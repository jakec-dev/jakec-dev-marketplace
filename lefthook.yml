# Shared git hooks, run by lefthook (https://lefthook.dev/). Install them once per clone with `lefthook install`.
# CI runs the same checks, because `git commit --no-verify` and GitHub's web editor skip these.
commit-msg:
  jobs:
    - name: conventional-commit
      run: bash scripts/check-commit-msg.sh {1}

pre-commit:
  jobs:
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
    - name: shfmt
      glob: "*.sh"
      run: shfmt --write {staged_files}
      stage_fixed: true
